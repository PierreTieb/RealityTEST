<!DOCTYPE html><html><head><meta charset="UTF-8"><script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script></head><body><pre id="o"></pre>
<script type="module">
import { CATALOGUE, layout } from './js/molecules.js';
const ang = (L, c, a, b) => { const u = L[a].clone().sub(L[c]).normalize(), v = L[b].clone().sub(L[c]).normalize(); return (Math.acos(u.dot(v)) * 180 / Math.PI).toFixed(0); };
const get = n => CATALOGUE.find(m => m.name === n);
let s = '';
const t0 = performance.now();
for (const m of CATALOGUE) layout(m);
s += 'all layouts ms ' + (performance.now() - t0).toFixed(0) + '\n';
let L = layout(get('Eau')); s += 'Eau HOH ' + ang(L, 0, 1, 2) + ' pos ' + L.map(p => p.toArray().map(v => v.toFixed(2))).join(' / ') + '\n';
L = layout(get('Ammoniac')); s += 'NH3 HNH ' + ang(L, 0, 1, 2) + ',' + ang(L, 0, 2, 3) + '\n';
L = layout(get('Méthane')); s += 'CH4 ' + ang(L, 0, 1, 2) + ',' + ang(L, 0, 3, 4) + '\n';
L = layout(get('Dioxyde de carbone')); s += 'CO2 ' + ang(L, 0, 1, 2) + '\n';
L = layout(get('Ozone')); s += 'O3 ' + ang(L, 0, 1, 2) + '\n';
L = layout(get('Éthène (éthylène)')); s += 'C2H4 HCC ' + ang(L, 0, 1, 2) + ' HCH ' + ang(L, 0, 2, 3) + '\n';
L = layout(get('Benzène')); s += 'C6H6 CCC ' + ang(L, 1, 0, 2) + ' z-spread ' + Math.max(...L.map(p => Math.abs(p.y))).toFixed(2) + '\n';
L = layout(get('Éthène (éthylène)')); s += 'C2H4 flat ' + Math.max(...L.map(p => Math.abs(p.y))).toFixed(2) + ' / '; L = layout(get('Éthyne (acétylène)')); s += 'C2H2 ' + ang(L, 0, 1, 2) + '\n';
document.getElementById('o').textContent = s;
</script></body></html>
