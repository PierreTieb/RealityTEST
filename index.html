<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c2226">
  <title>La réalité augmentée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- ?v= : à changer après une modification, pour que les téléphones ne gardent pas l'ancienne version en cache -->
  <link rel="stylesheet" href="css/style.css?v=3">
  <script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
  <script src="lib/aruco/cv.js"></script>
  <script src="lib/aruco/svd.js"></script>
  <script src="lib/aruco/posit1.js"></script>
  <script src="lib/aruco/aruco.js"></script>
  <script type="module" src="js/app.js?v=3"></script>
  <script src="js/home.js" defer></script>
</head>
<body>

  <!-- Repère universel (ArUco MIP_36h12, id 0), dessiné case par case d'après repere/repere.png : 8 × 8 cases noires
       dans une marge blanche d'une case. En SVG plutôt qu'en image : sur iPhone, l'image PNG disparaissait ou ne s'affichait pas. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="repere-0" viewBox="0 0 10 10">
      <rect width="10" height="10" fill="#fff"/>
      <path fill="#000" shape-rendering="crispEdges" d="M1 1h8v1h-8zM1 2h1v7h-1zM8 2h1v7h-1zM2 8h6v1h-6zM4 2h1v1h-1zM6 2h2v1h-2zM3 3h1v1h-1zM5 3h1v1h-1zM2 4h1v1h-1zM5 4h3v1h-3zM5 5h1v1h-1zM7 5h1v1h-1zM2 6h4v1h-4zM7 6h1v1h-1zM2 7h1v1h-1zM6 7h1v1h-1z"/>
    </symbol>
  </svg>

  <!-- ===== Accueil : choix du module ===== -->
  <section class="screen screen--home screen--active" id="screen-home">
    <div id="home-bg" aria-hidden="true"></div>
    <div class="home-in">
      <!-- Bouton du repère : l'afficher en grand (à viser avec un autre appareil) ou télécharger le PDF à imprimer -->
      <div class="home-top">
        <button type="button" class="marker-btn" id="marker-btn" aria-label="Le repère : l'afficher ou l'imprimer" aria-expanded="false" aria-controls="marker-menu">
          <svg width="38" height="38" viewBox="0 0 10 10" aria-hidden="true"><use href="#repere-0"/></svg>
        </button>
        <div class="marker-menu" id="marker-menu" hidden>
          <button type="button" class="marker-menu__item" id="marker-show-open">
            <b>Afficher le repère</b>
            <span>En grand sur cet écran, pour le viser avec la caméra d'un autre appareil</span>
          </button>
          <button type="button" class="marker-menu__item" data-pdf="repere/repere-a-imprimer.pdf" data-name="Repère de réalité augmentée.pdf">
            <b>Imprimer le repère</b>
            <span>Télécharge le PDF : atomes, Soleil/Terre/Lune, chronophotographie</span>
          </button>
          <button type="button" class="marker-menu__item" data-pdf="repere/reperes-reactifs.pdf" data-name="Repères des réactifs.pdf">
            <b>Imprimer les repères des réactifs</b>
            <span>Télécharge le PDF à découper : transformation chimique</span>
          </button>
        </div>
      </div>
      <h1 class="app-title">La réalité augmentée</h1>
      <p class="app-subtitle">Travailler et découvrir avec une vue 3D en temps réel</p>

      <div class="module">
      <!-- Module 1 : atome de lithium animé (repris de la carte « tailles » de Diverses Questions Scientifiques) -->
      <button type="button" class="q-card q-card--atom" data-view="atom">
        <svg class="q-card__art" viewBox="0 0 320 120" aria-hidden="true">
          <defs>
            <radialGradient id="g-p" cx=".35" cy=".3"><stop offset="0" stop-color="#ffb9b0"/><stop offset=".55" stop-color="#e2453b"/><stop offset="1" stop-color="#8a1f1a"/></radialGradient>
            <radialGradient id="g-n" cx=".35" cy=".3"><stop offset="0" stop-color="#c9f5da"/><stop offset=".55" stop-color="#3fbf74"/><stop offset="1" stop-color="#1c6b42"/></radialGradient>
            <radialGradient id="g-e" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9fc2ff"/></radialGradient>
            <radialGradient id="g-eh"><stop offset="0" stop-color="#bcd4ff" stop-opacity=".7"/><stop offset="1" stop-color="#bcd4ff" stop-opacity="0"/></radialGradient>
            <radialGradient id="g-nh"><stop offset="0" stop-color="#ff9c84" stop-opacity=".35"/><stop offset="1" stop-color="#ff9c84" stop-opacity="0"/></radialGradient>
          </defs>
          <g id="atom-stars" fill="#fff"></g>
          <g transform="translate(160 60) scale(1.35) translate(-84 -60)">
            <circle cx="84" cy="60" r="22" fill="url(#g-nh)"/>
            <g id="orb-back" fill="none" stroke="#a9c6ff" stroke-linecap="round"></g>
            <g id="el-back"></g>
            <g><circle cx="90.2" cy="61.7" r="5.4" fill="url(#g-n)"/><circle cx="85.7" cy="66.2" r="5.4" fill="url(#g-p)"/><circle cx="79.5" cy="64.5" r="5.4" fill="url(#g-n)"/><circle cx="77.8" cy="58.3" r="5.4" fill="url(#g-p)"/><circle cx="82.3" cy="53.8" r="5.4" fill="url(#g-n)"/><circle cx="88.5" cy="55.5" r="5.4" fill="url(#g-p)"/><circle cx="84.2" cy="60.4" r="5.4" fill="url(#g-n)"/></g>
            <g id="orb-front" fill="none" stroke="#a9c6ff" stroke-linecap="round"></g>
            <g id="el-front"></g>
          </g>
        </svg>
        <span class="q-card__title">Les atomes et les ions</span>
        <span class="q-card__sub">Construis un atome ou un ion, proton par proton</span>
      </button>
      </div>


      <div class="module">
      <!-- Module 2 : CO₂ qui se défait en C + O₂, puis se refait (3 s dans chaque sens) -->
      <button type="button" class="q-card q-card--reaction" data-view="reaction">
        <svg class="q-card__art" viewBox="0 0 320 120" aria-hidden="true">
          <defs>
            <radialGradient id="g-c" cx=".35" cy=".3"><stop offset="0" stop-color="#8a8f99"/><stop offset=".55" stop-color="#2c2f36"/><stop offset="1" stop-color="#0c0d10"/></radialGradient>
            <radialGradient id="g-o" cx=".35" cy=".3"><stop offset="0" stop-color="#ffb3ab"/><stop offset=".55" stop-color="#ec3a30"/><stop offset="1" stop-color="#8c1a14"/></radialGradient>
            <radialGradient id="g-glow"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".45"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
          </defs>
          <circle id="rx-glow" cx="160" cy="58" r="70" fill="url(#g-glow)" opacity="0"/>
          <text id="rx-plus" x="152" y="66" fill="#fff" font-size="28" font-weight="700" text-anchor="middle" opacity="0">+</text>
          <g id="rx-atoms">
            <g id="rx-c"><circle r="17" fill="url(#g-c)"/><text y="6" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">C</text></g>
            <g id="rx-o1"><circle r="18" fill="url(#g-o)"/><text y="6" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">O</text></g>
            <g id="rx-o2"><circle r="18" fill="url(#g-o)"/><text y="6" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">O</text></g>
          </g>
          <text id="rx-left" x="160" y="108" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">CO₂</text>
          <text id="rx-right" x="160" y="108" fill="#fff" font-size="15" font-weight="700" text-anchor="middle" opacity="0">C + O₂</text>
        </svg>
        <span class="q-card__title">Transformation chimique</span>
        <span class="q-card__sub">Pose les bons réactifs : les atomes se réarrangent sous tes yeux</span>
      </button>
      </div>

      <!-- Module 3 : la Terre au premier plan, éclairée seulement côté Soleil ; le Soleil brille au loin à droite -->
      <div class="module">
      <button type="button" class="q-card q-card--sky" data-view="sky">
        <svg class="q-card__art" viewBox="0 0 320 120" aria-hidden="true">
          <defs>
            <radialGradient id="g-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffdf0"/><stop offset=".18" stop-color="#fff2b0"/><stop offset=".4" stop-color="#ffc94d" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a1f" stop-opacity="0"/></radialGradient>
            <radialGradient id="g-ocean" cx=".7" cy=".4" r=".8"><stop offset="0" stop-color="#5aa8ff"/><stop offset=".6" stop-color="#2a6fd0"/><stop offset="1" stop-color="#143c80"/></radialGradient>
            <linearGradient id="g-night" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#02040c" stop-opacity=".96"/><stop offset=".48" stop-color="#02040c" stop-opacity=".9"/><stop offset=".62" stop-color="#02040c" stop-opacity="0"/></linearGradient>
            <clipPath id="c-earth"><circle cx="78" cy="74" r="50"/></clipPath>
          </defs>
          <g id="sky-stars" fill="#fff"></g>
          <g id="sun-rays" transform="translate(272 38)" stroke="#ffe38a" stroke-linecap="round" opacity=".7"></g>
          <circle id="sun-glow" cx="272" cy="38" r="34" fill="url(#g-sun)"/>
          <circle cx="272" cy="38" r="8.5" fill="#fffef5"/>
          <g clip-path="url(#c-earth)">
            <circle cx="78" cy="74" r="50" fill="url(#g-ocean)"/>
            <g id="earth-land" fill="#58b04f"></g>
            <circle cx="78" cy="74" r="50" fill="url(#g-night)"/>
          </g>
          <circle cx="78" cy="74" r="50" fill="none" stroke="#9fd0ff" stroke-opacity=".35" stroke-width="1.5"/>
        </svg>
        <span class="q-card__title">Système Soleil/Terre/Lune</span>
        <span class="q-card__sub">Les phases de la Lune et les éclipses</span>
      </button>
      </div>

      <!-- Module 4 : voiture vue de dessus qui laisse ses clichés derrière elle, puis tout s'efface en fondu -->
      <div class="module">
      <button type="button" class="q-card q-card--chrono" data-view="chrono">
        <svg class="q-card__art" viewBox="0 0 320 120" aria-hidden="true">
          <rect x="0" y="40" width="320" height="44" fill="#3a4148"/>
          <path d="M0 41H320M0 83H320" stroke="#e8e8e8" stroke-width="2"/>
          <path d="M0 62H320" stroke="#f2d84b" stroke-width="2" stroke-dasharray="14 10"/>
          <g id="chrono-ghosts"></g>
          <g id="chrono-car"></g>
        </svg>
        <span class="q-card__title">Chronophotographie</span>
        <span class="q-card__sub">Les positions d'un objet à intervalles de temps réguliers</span>
      </button>
      </div>
    </div>
  </section>

  <!-- ===== Caméra indisponible ===== -->
  <section class="screen" id="screen-camera-error">
    <div class="panel">
      <h2>Caméra indisponible</h2>
      <p id="camera-error-text"></p>
      <div class="panel__actions">
        <button class="btn btn--main" id="camera-retry">Réessayer</button>
        <button class="btn btn--ghost" data-go="home">Retour à l'accueil</button>
      </div>
    </div>
  </section>

  <!-- ===== Vue en réalité augmentée ===== -->
  <section class="screen screen--ar" id="screen-ar">
    <video class="ar-video" id="ar-video" playsinline muted></video>
    <div class="ar-layer is-hidden" id="ar-layer">
      <canvas class="ar-canvas" id="ar-canvas"></canvas>
      <div class="card" id="ar-card"></div>
    </div>
    <div class="ar-search" id="ar-search">
      <img id="ar-search-img" src="repere/repere.png" alt="">
      <span id="ar-search-text">Montre le repère à la caméra</span>
      <button type="button" class="ar-search__link" id="ar-search-link">Pas de repère ? Affiche-le ici</button>
    </div>
    <div class="ar-top">
      <button class="chip" data-go="home">← Accueil</button>
      <button class="chip" id="camera-switch" hidden>Changer de caméra</button>
    </div>
    <div class="ar-controls" id="ar-controls"></div>
  </section>

  <!-- Repère affiché en grand (menu du repère > Afficher) -->
  <div class="marker-show" id="marker-show" hidden>
    <svg width="300" height="300" viewBox="0 0 10 10" role="img" aria-label="Repère de réalité augmentée"><use href="#repere-0"/></svg>
    <p>Vise ce repère avec la caméra d'un autre appareil</p>
    <button type="button" class="marker-show__close" id="marker-show-close">✕ Fermer</button>
  </div>

</body>
</html>
